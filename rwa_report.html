<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colony Fix - Report an issue</title>
  <link rel="stylesheet" href="rwa_report.css">
</head>
<body>

  <header class="topbar">
    <h1>Report an issue</h1>
    <p>Fill in the details and your RWA will see it.</p>
  </header>

  <main>
    <form class="report-form" method="post" action="/report" enctype="multipart/form-data">
 <span class="field-title">Category</span>
<div class="category-picker">
  <input type="radio" id="cat-water" name="category" value="Water" required>
  <label for="cat-water">💧 Water</label>

  <input type="radio" id="cat-electricity" name="category" value="Electricity">
  <label for="cat-electricity">⚡ Electricity</label>

  <input type="radio" id="cat-roads" name="category" value="Roads">
  <label for="cat-roads">🛣️ Roads</label>

  <input type="radio" id="cat-garbage" name="category" value="Garbage">
  <label for="cat-garbage">🗑️ Garbage</label>

  <input type="radio" id="cat-streetlights" name="category" value="Streetlights">
  <label for="cat-streetlights">💡 Streetlights</label>

  <input type="radio" id="cat-other" name="category" value="Other">
  <label for="cat-other">📌 Other</label>
</div>s
<label for="photo">Photo</label>
      <input type="file" id="photo" name="photo" accept="image/*" required>
      <img id="preview" class="preview" alt="">

      <label for="description">What is the problem?</label>
      <textarea id="description" name="description" rows="4" maxlength="300" placeholder="Write a short description" required></textarea>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Example: Lane 4, near the park gate" required>

      <button type="submit" class="big-button">Submit report</button>
      </form>
  </main>

  <nav class="bottom-nav">
    <a href="/">Home</a>
    <a href="/report" class="active">Report</a>
    <a href="/track">Track</a>
    <a href="/dashboard">Dashboard</a>
  </nav>
  <script>
    var photoInput = document.getElementById("photo");
    var preview = document.getElementById("preview");

    photoInput.addEventListener("change", function () {
      var file = photoInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    });
  </script>
  <body/>
    <html/>
