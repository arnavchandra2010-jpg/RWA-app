<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colony Fix - RWA Login</title>
  <link rel="stylesheet" href="/static/rwa.css">
</head>
<body class="login-body">

  <div class="login-wrap">
    <a class="login-back" href="/">← Back to home</a>

    <form class="login-card" method="post" action="/login">
      <span class="login-badge">RWA access</span>
      <h1>Representative login</h1>
      <p>Sign in to review reports and update their status.</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit" class="login-button">Log in</button>
    </form>
  </div>

</body>
</html>
