<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colony Fix - Track issues</title>
  <link rel="stylesheet" href="rwa_track.css">
</head>
<body>
  <header class="topbar">
    <h1>Track issues</h1>
    <p>See every reported problem and its current status.</p>
  </header>

  <main>
<section class="summary">
      <div class="summary-box">
        <span class="summary-number">0</span>
        <span class="status reported">Reported</span>
      </div>
      <div class="summary-box">
        <span class="summary-number">0</span>
        <span class="status in-progress">In progress</span>
      </div>
      <div class="summary-box">
        <span class="summary-number">0</span>
        <span class="status resolved">Resolved</span>
      </div>
    </section>

    <section>
      <h3>All issues</h3>
      <div class="empty">
        <p>No issues reported yet.</p>
        <p>Reported issues and their status will show up here.</p>
        <a class="link-button" href="rwa_report.html">Report the first issue</a>
      </div>
    </section>

  </main>
 <nav class="bottom-nav">
    <a href="rwa.html">Home</a>
    <a href="rwa_report.html">Report</a>
    <a href="rwa_track.html" class="active">Track</a>
  </nav>

</body>
</html>
